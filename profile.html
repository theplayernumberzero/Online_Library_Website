    <script>
        function parseJwt(token) {
            try {
                const base64Url = token.split('.')[1];
                const base64 = base64Url.replace(/-/g, '+').replace(/_/g, '/');
                const jsonPayload = decodeURIComponent(
                    atob(base64).split('').map(function(c) {
                        return '%' + ('00' + c.charCodeAt(0).toString(16)).slice(-2);
                    }).join('')
                );
                return JSON.parse(jsonPayload);
            } catch (e) {
                return null;
            }
        }
    
        document.addEventListener("DOMContentLoaded", function () {
            if(!localStorage.getItem("token")){
                window.location.href = "login.html";
            }

            authControl();

            const token = localStorage.getItem("token");
            const claims = parseJwt(token);
    
            if (!claims) {
                console.error("Token could not be parsed.");
                return;
            }
    
            const nameSurname = claims["name"] || "N/A";
            const username = claims["unique_name"] || "N/A";
            const email = claims["http://schemas.xmlsoap.org/ws/2005/05/identity/claims/emailaddress"] || "N/A";
    
            const colDiv = document.querySelector(".col-md-4");
            colDiv.innerHTML = `
                <div class="profile-info fade-in">
                    <h3 class="mb-4">Personal Information</h3>
                    <p><strong>Name Surname:</strong> ${nameSurname}</p>
                    <p><strong>Username:</strong> ${username}</p>
                    <p><strong>Email:</strong> ${email}</p>
                </div>
            `;

            const borrowedBooksDiv = document.querySelector("#borrowedBooks");

            fetch("https://localhost:7122/api/UserBookBorrow/GetBookBorrows", {
                    method: "GET",
                    headers: {
                        "Authorization": `Bearer ${localStorage.getItem("token")}`,
                        "Content-Type": "application/json"
                    }
                })
                .then(response => response.json())
                .then(data=>{
                    var books = data.value.books;
                    console.log(data);

                    if(books.length == null || books.length == 0){
                        borrowedBooksDiv.innerHTML = `<div class="text-center text-muted" id="noBooksMessage">
                                                            <i class="fas fa-book fa-3x mb-3"></i>
                                                            <p>You have not borrowed any books yet.</p>
                                                        </div>`;
                    }
                    else{
                        books.forEach(book => {
                            borrowedBooksDiv.innerHTML += `
                            <div class="cart-item" style="display: flex; align-items: center; gap: 16px; padding: 16px; border-bottom: 1px solid #ccc;">
                                <img src="${book.ImageBase64}" alt="Book Image" style="width: 80px; height: 120px; object-fit: cover; border-radius: 4px;">
                                    
                                <div style="flex-grow: 1;">
                                    <h3 style="margin: 0 0 8px; font-size: 18px;">${book.name}</h3>
                                    <p style="margin: 0; color: #555;"><strong>Author: </strong>${book.authorName}</p>
                                    <p style="margin: 0; color: #555;"><strong>Borrow Date: </strong>${new Date(book.borrowedDate).toLocaleString()}</p>
                                    <p style="margin: 0; color: #555;"><strong>Bring Back Date: </strong>${new Date(book.borrowEndDate).toLocaleString()}</p>
                                </div>
                            </div>
                        `;
                        });
                    }
                })
                .catch(err => {
                    console.error("Error fetching borrowed books:", err);
                });
        });
    </script>
