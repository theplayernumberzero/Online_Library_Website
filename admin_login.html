<!DOCTYPE html>
<html lang="tr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login - Online Library</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="stylesheet" href="css/style.css">
    <style>
        body {
            background-color: #f2f4f7;
        }

        .admin-card {
            border: 1px solid #ced4da;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.05);
        }

        .admin-header {
            background-color: #212529;
            color: white;
            padding: 1.5rem;
            border-radius: .375rem .375rem 0 0;
            text-align: center;
        }

        .admin-header i {
            font-size: 2rem;
        }

        .btn-admin {
            background-color: #212529;
            color: white;
        }

        .btn-admin:hover {
            background-color: #343a40;
        }
    </style>
</head>

<body>

    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container">
            <a class="navbar-brand" href="main_page.html">
                <i class="fas fa-shield-alt"></i> Admin Panel - Online Library
            </a>
        </div>
    </nav>

    <div class="container mt-5">
        <div class="row justify-content-center">
            <div class="col-md-5">
                <div class="card admin-card">
                    <div class="admin-header">
                        <i class="fas fa-user-shield mb-2"></i>
                        <h4 class="mt-2">Admin Login</h4>
                    </div>
                    <div class="card-body">
                        <form id="adminLoginForm">
                            <div class="mb-3">
                                <label for="adminUsername" class="form-label">Email or Username</label>
                                <input type="text" class="form-control" id="adminUsername" required>
                            </div>
                            <div class="mb-3">
                                <label for="adminPassword" class="form-label">Password</label>
                                <div class="input-group">
                                    <input type="password" class="form-control" id="adminPassword" required>
                                    <span class="input-group-text">
                                        <i class="fas fa-eye"></i>
                                    </span>
                                </div>
                            </div>
                            <div class="d-grid gap-2">
                                <button type="submit" class="btn btn-admin" onclick="Login()">Login</button>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="js/bootstrap.bundle.min.js"></script>
    <script src="js/main.js"></script>
    <script>
        function Login() {
    event.preventDefault();
    fetch("https://localhost:7122/api/auth/login", {
        method: "POST",
        headers: {
            "Content-Type": "application/json"
        },
        body: JSON.stringify({
            usernameOrEmail: document.getElementById("adminUsername").value,
            password: document.getElementById("adminPassword").value
        })
    })
        .then(response => response.json())
        .then(data => {
            if (!data.StatusCode) {
                localStorage.setItem("userId", data.userId);
                localStorage.setItem("token", data.token);
                window.location.href = "admin_dashboard.html";
            }
            else {
                if (data.StatusCode == 400) {
                    var errors = "<ul>";
                    data.Errors.forEach(error => {
                        errors += `<li>${error}</li>`;
                    });
                    errors += "</ul>";
                    showNotification(errors, "danger");
                }
                else if (data.StatusCode == 500) {
                    showNotification(data.Message, "danger");
                }
                else {
                    showNotification("An unexpected error occurred", "danger");
                }
            }
        })
        .catch(error => {
            showNotification(error.message, "danger");
        });
}
    </script>
</body>
</html>
