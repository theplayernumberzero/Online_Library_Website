<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Borrow - Online Library</title>
    <link href="css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container">
            <a class="navbar-brand" href="main_page.html">Online Library</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item">
                        <a class="nav-link" href="main_page.html">Home Page</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="books.html">All Books</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="buy.html">My Cart <i class="fas fa-shopping-cart"></i></a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="profile.html">Profile</a>
                    </li>
                    <li class="nav-item" id="authButtonContainer">
                        
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <div class="container mt-4">
        <h2 class="mb-4">Books to Borrow</h2>
        
        <div id="cartItems" class="mb-4">
            
        </div>
        <div id="borrowBooksContainer">
            <div class="text-end mr-4">
                <button class="btn btn-primary" id="borrowButton" onclick="BorrowBooksModal()">Borrow Selected Books</button>
            </div>
        </div>
    </div>

    <div class="modal fade" id="BorrowBooksModal" tabindex="-1" aria-labelledby="BorrowBooksModalLabel" aria-hidden="true">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="myModalLabel">Choose a date to bring back</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    <input type="datetime-local" id="dateToBring" />
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-primary" onclick="BorrowBooks()">Close</button>
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
                </div>
            </div>
        </div>
    </div>

    <footer class="bg-dark text-white py-3 position-fixed bottom-0 w-100">
        <div class="container">
          <div class="row align-items-center">
            <div class="col-md-6 text-center text-md-start mb-3 mb-md-0">
              <h5 class="mb-1">Online Library</h5>
              <small>© 2025 All rights reserved.</small>
            </div>
            <div class="col-md-6 text-center text-md-end">
              <a href="main_page.html" class="text-white text-decoration-none me-3">Home</a>
              <a href="books.html" class="text-white text-decoration-none me-3">All Books</a>
              <a href="login.html" class="text-white text-decoration-none me-3">Login</a>
              <a href="signup.html" class="text-white text-decoration-none">Sign up</a>
            </div>
          </div>
        </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/main.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', ()=>{
            authControl();

            var cartItemsJson = localStorage.getItem("cart");
            var cartItems = JSON.parse(cartItemsJson);
            if(cartItems == null || cartItems.length == 0){
                document.querySelector('#cartItems').innerHTML += `<div class="text-center text-muted">
                            <i class="fas fa-shopping-cart fa-3x mb-3"></i>
                            <p>There are no books in your cart yet.</p>
                        </div>`;
                document.querySelector('#borrowBooksContainer').style.display = "none";
            }
            else{
                cartItems.forEach(item => {
                    fetch("https://localhost:7122/api/books/" + item.id)
                    .then(response => response.json())
                    .then(data=>{
                        let book = data.value;
                        document.querySelector('#cartItems').innerHTML += `
                            <div class="cart-item" style="display: flex; align-items: center; gap: 16px; padding: 16px; border-bottom: 1px solid #ccc;">
                                <img src="${book.ImageBase64}" alt="Book Image" style="width: 80px; height: 120px; object-fit: cover; border-radius: 4px;">
                                
                                <div style="flex-grow: 1;">
                                    <h3 style="margin: 0 0 8px; font-size: 18px;">${book.name}</h3>
                                    <p style="margin: 0; color: #555;">Author: <strong>${book.authorName}</strong></p>
                                </div>
                                
                                <div>
                                    <button style="background-color: red; color: white; padding: 6px 12px; border: none; border-radius: 4px;" onclick="RemoveBookFromCart('${book.id}')">Remove</button>
                                </div>
                            </div>
                        `;
                    });
                });
            }
        });

        function RemoveBookFromCart(id) {
            var books = localStorage.getItem("cart");
            var booksArray = JSON.parse(books);
            var newBooksArray = booksArray.filter(book => book.id !== id);
            localStorage.setItem("cart", JSON.stringify(newBooksArray));
            location.reload();
        }

        function BorrowBooksModal() {
            const modal = new bootstrap.Modal(document.getElementById('BorrowBooksModal'));
            modal.show();
        }
        
        function BorrowBooks() {
            var cart = localStorage.getItem("cart");
            var cartArray = JSON.parse(cart);
            var cartIds = cartArray.map(c=>c.id);
            const promises = cartIds.map(id => {
                return fetch("https://localhost:7122/api/userBookBorrow", {
                    method: "POST",
                    headers: {
                        "Authorization": `Bearer ${localStorage.getItem("token")}`,
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify({
                        bookId: id,
                        borrowDate: new Date().toISOString(),
                        borrowEndDate: new Date(document.getElementById("dateToBring").value).toISOString(),
                        status: true
                    })
                }).then(response => {
                    if (response.status === 401) {
                        window.location.href = "login.html";
                    } else if(response.status === 500) {
                        return response.json().then(data => {
                            showNotification(data.message, "danger");
                        });
                    }
                }).catch(err => {
                    showNotification(err.message || err, "danger");
                });
            });

            Promise.all(promises).then(() => {
                showNotification("Books are borrowed successfully!", "success");
                localStorage.removeItem("cart");
                setTimeout(() => {
                    location.reload();
                }, 2500);
            });

        }
    </script>
</body>
</html>
