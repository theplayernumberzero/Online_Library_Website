<!DOCTYPE html>
<html lang="tr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Online Library</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="stylesheet" href="css/style.css">
</head>

<body>
    <nav class="navbar navbar-expand-lg navbar-light bg-light">
        <div class="container">
            <a class="navbar-brand" href="main_page.html">
                <i class="fas fa-book-reader"></i> Online Library
            </a>
        </div>
    </nav>

    <div class="container mt-5">
        <div class="row justify-content-center">
            <div class="col-md-6">
                <div class="card fade-in">
                    <div class="card-body">
                        <h2 class="card-title text-center mb-4">Login</h2>
                        <form id="loginForm">
                            <div class="mb-3">
                                <label for="username" class="form-label">Email or Username</label>
                                <input type="text" class="form-control" id="username" required>
                            </div>
                            <div class="mb-3">
                                <label for="password" class="form-label">Password</label>
                                <div class="input-group">
                                    <input type="password" class="form-control" id="password" required>
                                    <span class="input-group-text toggle-password">
                                        <i class="fas fa-eye"></i>
                                    </span>
                                </div>
                            </div>
                            <div class="d-grid gap-2">
                                <button type="submit" class="btn btn-primary" onclick="Login()">Login</button>
                            </div>
                        </form>
                        <div class="text-center mt-3">
                            <p>Don't have an account? <a href="signup.html">Sign Up</a></p>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="js/bootstrap.bundle.min.js"></script>
    <script src="js/main.js"></script>
    <script>
        function Login() {
            event.preventDefault();
            fetch("https://localhost:7122/api/auth/login", {
                method: "POST",
                headers: {
                    "Content-Type": "application/json"
                },
                body: JSON.stringify({
                    usernameOrEmail: document.getElementById("username").value,
                    password: document.getElementById("password").value
                })
            })
                .then(response => response.json())
                .then(data => {
                    if(!data.StatusCode){
                        localStorage.setItem("userId", data.userId);
                        localStorage.setItem("token", data.token);
                        window.location.href = "main_page.html";
                    }
                    else{
                        if(data.StatusCode == 400){
                            var errors="<ul>";
                            data.Errors.forEach(error => {
                                errors += `<li>${error}</li>`;
                            });
                            errors += "</ul>";
                            showNotification(errors, "danger");
                        }
                        else if(data.StatusCode == 500){
                            showNotification(data.Message, "danger");
                        }
                        else{
                            showNotification("An unexpected error occurred", "danger");
                        }
                    }
                })
                .catch(error => {
                    showNotification(error.message, "danger");
                });
        }
    </script>
</body>
</html>
